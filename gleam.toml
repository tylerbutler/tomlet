name = "tomlet"
version = "1.4.1"

description = "A round-tripping TOML parser and writer for Gleam, preserving comments, key order, and formatting."
licences = ["Apache-2.0", "MIT"]
repository = { type = "github", user = "tylerbutler", repo = "tomlet" }
links = [
  { title = "TOML 1.1 spec", href = "https://toml.io/en/v1.1.0" },
  { title = "TOML 1.0 spec", href = "https://toml.io/en/v1.0.0" },
]
internal_modules = ["tomlet/ast", "tomlet/key", "tomlet/lexer", "tomlet/parser", "tomlet/path"]
#
# For a full reference of all the available options, you can have a look at
# https://gleam.run/writing-gleam/gleam-toml/.

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
william = ">= 1.0.0 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
glinter = ">= 2.19.0 and < 3.0.0"

[tools.glinter]
include = ["src/", "test/"]

[tools.glinter.rules]
# Correctness — fail the build.
avoid_panic = "error"
avoid_todo = "error"
division_by_zero = "error"

# Too opinionated for this codebase (flags labels on most multi-arg functions).
label_possible = "off"

[tools.glinter.ignore]
# gleeunit discovers `pub fn *_test` by reflection, leans on `let assert`, and
# its test bodies return Nil — so these rules fight test conventions. They stay
# enabled for src/, where they're useful, and are suppressed only for tests.
"test/**/*.gleam" = [
  "unused_exports",
  "assert_ok_pattern",
  "missing_type_annotation",
]

[tools.trellis]
# Members are auto-discovered: the root package and examples/*.

[tools.trellis.exclude]
# glinter is a dev dependency of the root package only.
lint = ["examples/*"]

[tools.trellis.tasks.lint]
command = "gleam run -m glinter"
needs_deps = true

[tools.trellis.changelog]
# The root package owns every file, so CI-only or docs-only PRs would
# otherwise need a fragment. Report missing entries without failing.
strictness = "warn"
# Keep the CHANGELOG.md preamble used before trellis.
header_format = """# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html)."""

[tools.trellis.publish]
# Keep the v1.2.3 tag style used before trellis.
exact_tag_format = "v{version}"

[tools.trellis.publish.lifecycle.packages]
# Examples are never versioned, tagged, or published.
"examples/*" = "workspace"
