name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: write

jobs:
  # PR title conventional commit validation
  title:
    name: PR Title
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # ratchet:jdx/mise-action@v4
        with:
          install_args: node

      - name: Install commitlint
        run: npm install --save-dev @commitlint/cli @commitlint/config-conventional

      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | npx commitlint

  # Changelog entry check
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup trellis
        uses: ./.github/actions/setup-trellis
      - name: Check workspace invariants
        run: trellis doctor --format github
      # changelog.strictness = "warn" in gleam.toml: a missing entry is
      # reported in the comment but does not fail the job.
      - name: Check changelog entries
        id: changelog
        run: |
          trellis changelog check \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --format github >> "$GITHUB_OUTPUT"
      - name: Comment with changelog preview
        if: >-
          steps.changelog.outputs.has_entries == 'true'
          || steps.changelog.outputs.needs_entry == 'true'
          || steps.changelog.outputs.invalid_fragments != '[]'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # ratchet:marocchino/sticky-pull-request-comment@v2
        with:
          header: changelog
          message: ${{ steps.changelog.outputs.preview }}
      - name: Remove changelog comment
        if: >-
          steps.changelog.outputs.has_entries == 'false'
          && steps.changelog.outputs.needs_entry == 'false'
          && steps.changelog.outputs.invalid_fragments == '[]'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # ratchet:marocchino/sticky-pull-request-comment@v2
        with:
          header: changelog
          delete: true
