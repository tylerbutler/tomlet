name: Publish

on:
  push:
    tags: ['v*']

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Setup trellis
        uses: ./.github/actions/setup-trellis

      # Skips versions already on Hex, so a re-run after a partial failure is safe.
      - name: Publish to Hex.pm
        run: trellis publish --tag "$GITHUB_REF_NAME"
        env:
          HEXPM_API_KEY: ${{ secrets.HEXPM_API_KEY }}

  sbom:
    needs: test
    runs-on: ubuntu-latest
    name: Attest SBOM
    env:
      # licence_audit v0.2.0 contains BEAM files compiled with OTP 28.
      MISE_ERLANG_VERSION: "28"
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Setup licence_audit
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # ratchet:jdx/mise-action@v4
        with:
          install_args: github:tylerbutler/licence_audit

      - name: Generate CycloneDX SBOM
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          export SOURCE_DATE_EPOCH
          licence_audit sbom --reproducible --output="dist/tomlet-${REF_NAME}.cdx.json"

      - name: Create source archive
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git archive --format=tar.gz --prefix="tomlet-${REF_NAME}/" \
            -o "dist/tomlet-${REF_NAME}.tar.gz" HEAD

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # ratchet:actions/attest@v4
        with:
          subject-path: dist/tomlet-${{ github.ref_name }}.tar.gz
          sbom-path: dist/tomlet-${{ github.ref_name }}.cdx.json

      - name: Attach SBOM to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # auto-tag.yml (trellis tag create --github-release) normally creates
          # the Release; retry briefly in case it
          # hasn't published yet, then self-heal by creating it ourselves so a
          # tag fully drives the release even if auto-tag never ran.
          for i in 1 2 3 4 5; do
            if gh release view "$REF_NAME" >/dev/null 2>&1; then
              break
            fi
            echo "Release $REF_NAME not yet available, sleeping..."
            sleep 10
          done
          if ! gh release view "$REF_NAME" >/dev/null 2>&1; then
            echo "Release $REF_NAME still missing; creating it."
            notes_file=".changes/tomlet/${REF_NAME}.md"
            if [ -f "$notes_file" ]; then
              # Drop the "## vX.Y.Z - DATE" heading; the title carries it.
              tail -n +2 "$notes_file" > /tmp/release-notes.md
              gh release create "$REF_NAME" --title "$REF_NAME" \
                --notes-file /tmp/release-notes.md
            else
              gh release create "$REF_NAME" --title "$REF_NAME" --generate-notes
            fi
          fi
          gh release upload "$REF_NAME" \
            "dist/tomlet-${REF_NAME}.cdx.json" \
            "dist/tomlet-${REF_NAME}.tar.gz" \
            --clobber
