name: Publish

on:
  push:
    tags: ['v*']

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # ratchet:actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Publish to Hex.pm
        run: gleam publish --yes
        env:
          HEXPM_API_KEY: ${{ secrets.HEXPM_API_KEY }}

  sbom:
    needs: test
    runs-on: ubuntu-latest
    name: Attest SBOM
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # ratchet:actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Setup licence_audit
        uses: tylerbutler/actions/setup-licence-audit@ee7def5950abcf0a519add705a95719ab345c05e # ratchet:tylerbutler/actions/setup-licence-audit@main
        with:
          version: v0.2.0
          setup-beam: "false"

      - name: Generate CycloneDX SBOM
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          export SOURCE_DATE_EPOCH
          licence_audit sbom --reproducible --output="dist/tomlet-${REF_NAME}.cdx.json"

      - name: Create source archive
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git archive --format=tar.gz --prefix="tomlet-${REF_NAME}/" \
            -o "dist/tomlet-${REF_NAME}.tar.gz" HEAD

      - name: Attest SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # ratchet:actions/attest@v4
        with:
          subject-path: dist/tomlet-${{ github.ref_name }}.tar.gz
          sbom-path: dist/tomlet-${{ github.ref_name }}.cdx.json

      - name: Attach SBOM to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # auto-tag.yml normally creates the Release; retry briefly in case it
          # hasn't published yet, then self-heal by creating it ourselves so a
          # tag fully drives the release even if auto-tag never ran.
          for i in 1 2 3 4 5; do
            if gh release view "$REF_NAME" >/dev/null 2>&1; then
              break
            fi
            echo "Release $REF_NAME not yet available, sleeping..."
            sleep 10
          done
          if ! gh release view "$REF_NAME" >/dev/null 2>&1; then
            echo "Release $REF_NAME still missing; creating it."
            notes_file=".changes/${REF_NAME}.md"
            if [ -f "$notes_file" ]; then
              # Drop the changie "## vX.Y.Z - DATE" heading; the title carries it.
              tail -n +2 "$notes_file" > /tmp/release-notes.md
              gh release create "$REF_NAME" --title "$REF_NAME" \
                --notes-file /tmp/release-notes.md
            else
              gh release create "$REF_NAME" --title "$REF_NAME" --generate-notes
            fi
          fi
          gh release upload "$REF_NAME" \
            "dist/tomlet-${REF_NAME}.cdx.json" \
            "dist/tomlet-${REF_NAME}.tar.gz" \
            --clobber
