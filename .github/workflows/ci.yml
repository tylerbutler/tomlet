name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test-erlang:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        otp-version: ["27", "28"]
    name: Test Erlang (OTP ${{ matrix.otp-version }})
    env:
      MISE_ERLANG_VERSION: ${{ matrix.otp-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Check formatting
        run: just format-check

      - name: Lint (glinter)
        run: just glint

      - name: Type check
        run: just check

      - name: Build (warnings as errors)
        run: just build-strict

      - name: Run tests
        run: just test-erlang

  test-javascript:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    name: Test JavaScript (Node ${{ matrix.node-version }})
    env:
      MISE_NODE_VERSION: ${{ matrix.node-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Build (warnings as errors)
        run: just build-strict-js

      - name: Run tests
        run: just test-js

  docs:
    runs-on: ubuntu-latest
    name: Docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Build documentation
        run: just docs
