name: "Setup Gleam Environment"
description: "Install project tools with mise and download dependencies with just"

runs:
  using: "composite"
  steps:
    - name: Install tools
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # ratchet:jdx/mise-action@v4
      with:
        install_args: erlang gleam rebar just node python
        cache_key: "{{default}}-otp${{ env.MISE_ERLANG_VERSION }}-node${{ env.MISE_NODE_VERSION }}"

    - name: Cache Gleam dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6
      with:
        path: |
          build/packages
          ~/.cache/gleam
        key: gleam-${{ runner.os }}-otp${{ env.MISE_ERLANG_VERSION }}-${{ hashFiles('.mise.toml', 'gleam.toml', 'manifest.toml') }}
        restore-keys: |
          gleam-${{ runner.os }}-

    - name: Download dependencies
      shell: bash
      run: just deps
