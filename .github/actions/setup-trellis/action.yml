name: "Setup trellis"
description: "Install the trellis binary at the version pinned in .mise.toml"

runs:
  using: "composite"
  steps:
    - name: Install trellis
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # ratchet:jdx/mise-action@v4
      with:
        install_args: github:tylerbutler/trellis
