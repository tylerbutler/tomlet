kind: Added
body: |-
    Expanded edit surface for dates, times, arrays, inline tables, and arrays of tables

    New constructors `date_from_string`, `time_from_string`, and `datetime_from_string` validate their input and produce the opaque `Date`, `Time`, and `DateTime` values, with a new `FormatError` covering invalid lexical forms. New setters `set_date`, `set_time`, `set_datetime`, `set_array`, and `set_inline_table` write the corresponding values at a key path; `append_array_of_tables` appends a new table to an array of tables, creating the array on first use. Closes #12.
time: 2026-05-25T22:11:09.000000000-07:00
