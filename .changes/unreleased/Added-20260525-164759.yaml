kind: Added
body: |-
    Round-tripping TOML parser and writer for Gleam

    Tomlet parses TOML 1.0.0 into an opaque document, validates UTF-8 input, exposes stable parse and edit errors, provides typed accessors for common value types, supports checked string and integer edits, removes existing values, inserts standalone comments, and writes documents back out with surrounding trivia intact.
