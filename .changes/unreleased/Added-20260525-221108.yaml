kind: Added
body: |-
    Typed date, time, and date-time accessors

    `get_date`, `get_time`, and `get_datetime` join the existing typed accessors and return the opaque `Date`, `Time`, and `DateTime` values. Errors follow the existing `GetError` shape. Closes #13.
